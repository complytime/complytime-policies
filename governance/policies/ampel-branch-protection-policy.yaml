title: AMPEL Branch Protection Policy
metadata:
    id: ampel-branch-protection-policy
    type: Policy
    description: Automated evaluation policy for branch protection controls using AMPEL
    author:
        id: complytime
        name: ComplyTime
        type: Software Assisted
    mapping-references:
        - id: repo-branch-protection
          title: Branch Protection Controls
          version: 1.0.0
          description: Control catalog for branch protection rules
          url: ../catalogs/ampel-branch-protection-catalog.yaml
contacts:
    responsible:
        - name: Repository Administrator
    accountable:
        - name: Security Team
scope:
    in:
        technologies:
            - GitHub
            - GitLab
        users:
            - Repository maintainers
imports:
    catalogs:
        - reference-id: repo-branch-protection
adherence:
    evaluation-methods:
        - id: ampel-automated-evaluation
          type: Gate
          mode: Automated
          description: AMPEL automated branch protection evaluation
          executor:
              id: ampel
              name: AMPEL
              type: Software
    assessment-plans:
        - id: require-pull-request
          requirement-id: require-pull-request
          frequency: on-demand
          evaluation-methods:
              - id: ampel-automated-evaluation
                type: Gate
                mode: Automated
        - id: minimum-approvals
          requirement-id: minimum-approvals
          frequency: on-demand
          evaluation-methods:
              - id: ampel-automated-evaluation
                type: Gate
                mode: Automated
        - id: block-force-push
          requirement-id: block-force-push
          frequency: on-demand
          evaluation-methods:
              - id: ampel-automated-evaluation
                type: Gate
                mode: Automated
        - id: prevent-admin-bypass
          requirement-id: prevent-admin-bypass
          frequency: on-demand
          evaluation-methods:
              - id: ampel-automated-evaluation
                type: Gate
                mode: Automated
        - id: require-code-owner-review
          requirement-id: require-code-owner-review
          frequency: on-demand
          evaluation-methods:
              - id: ampel-automated-evaluation
                type: Gate
                mode: Automated
