  state: Draft
- id: sa-3.2
  title: Use of Live or Operational Data
  objective: Approve, document, and control the use of live data in preproduction environments for the system, system component, or system service; and Protect preproduction environments for the system, system component, or system service at the same impact or classification level as any live data in use within the preproduction environments.
