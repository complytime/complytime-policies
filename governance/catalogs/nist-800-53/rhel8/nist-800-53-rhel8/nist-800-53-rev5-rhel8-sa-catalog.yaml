  state: Draft
- id: sa-2
  title: Allocation of Resources
  objective: Determine the high-level information security and privacy requirements for the system or system service in mission and business process planning; Determine, document, and allocate the resources required to protect the system or system service as part of the organizational capital planning and investment control process; and Establish a discrete line item for information security and privacy in organizational programming and budgeting documentation.
  group: sa
  assessment-requirements:
  - id: no-automated-check
    state: Active
    text: 'This control has no automated checks. ComplianceAsCode status: pending. Manual assessment required.'
    applicability:
    - rhel8-low
  state: Draft
- id: sa-3.1
  title: Manage Preproduction Environment
  objective: Protect system preproduction environments commensurate with risk throughout the system development life cycle for the system, system component, or system service.
  group: sa
  assessment-requirements:
  - id: no-automated-check
    state: Active
    text: 'This control has no automated checks. ComplianceAsCode status: pending. Manual assessment required.'
