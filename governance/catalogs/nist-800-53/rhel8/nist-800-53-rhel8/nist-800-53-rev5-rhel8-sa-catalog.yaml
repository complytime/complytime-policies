- id: sa-4.6
  title: Use of Information Assurance Products
  objective: Employ only government off-the-shelf or commercial off-the-shelf information assurance and information assurance-enabled information technology products that compose an NSA-approved solution to protect classified information when the networks used to transmit the information are at a lower classification level than the information being transmitted; and Ensure that these products have been evaluated and/or validated by NSA or in accordance with NSA-approved procedures.
  group: sa
  assessment-requirements:
  - id: no-automated-check
    state: Active
    text: 'This control has no automated checks. ComplianceAsCode status: pending. Manual assessment required.'
    applicability:
    - rhel8-low
  state: Draft
- id: sa-4.7
  title: 'NIAP-approved Protection Profiles '
  objective: Limit the use of commercially provided information assurance and information assurance-enabled information technology products to those products that have been successfully evaluated against a National Information Assurance partnership (NIAP)-approved Protection Profile for a specific technology type, if such a profile exists; and Require, if no NIAP-approved Protection Profile exists for a specific technology type but a commercially provided information technology product relies on cryptographic functionality to enforce its security policy, that the cryptographic module is FIPS-validated or NSA-approved.
  group: sa
  assessment-requirements:
  - id: no-automated-check
    state: Active
    text: 'This control has no automated checks. ComplianceAsCode status: pending. Manual assessment required.'
    applicability:
    - rhel8-low
