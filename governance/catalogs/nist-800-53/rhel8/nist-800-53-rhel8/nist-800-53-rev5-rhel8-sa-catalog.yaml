  title: Policy and Procedures
  objective: 'Develop, document, and disseminate to {{ insert: param, sa-1_prm_1 }}: Designate an {{ insert: param, sa-01_odp.04 }} to manage the development, documentation, and dissemination of the system and services acquisition policy and procedures; and Review and update the current system and services acquisition:'
