# SPDX-License-Identifier: Apache-2.0
---
# Gemara policy OCI: org-infra staging (pack + attest + keyless sign/verify) → Quay
# per specs/001-policy-oci-publish/spec.md and contracts/publish-pipeline.md.
#
# Interim / local demo (before gemaraproj/oci-artifact in org-infra):
#   - org-infra reusable_publish_gemara_oci uses: sonupreetam/gemara-publish-oci@7203d6158a16208a0338cc33ea001bb077f4705c
#   - Quay: default dest_image = test_complytime/complytime-policies (scripts/verify-interim-demo.sh)
# Pin: complytime/org-infra@7eabc2b960778190d38c591b7b96b376489d0acb (bump in README per FR-006)

name: Publish policy OCI

"on":
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag for GHCR and Quay (e.g. v0.1.0, sha-abc123de)"
        required: true
        type: string
      allow_unprotected_ref:
        description: >-
          Set true if the default branch is not protected (e.g. fork) so
          org-infra staging and sign/verify run.
        required: false
        type: boolean
        default: false
      bundle_file:
        description: "Root Gemara bundle YAML (relative to repo root)"
        required: false
        type: string
        default: bundles/cis-fedora-l1-workstation.yaml
      dest_image:
        description: >-
          Quay path (namespace/repository) without registry. Default is a POC namespace;
          set continuouscompliance/complytime-policies for org production.
        required: false
        type: string
        default: test_complytime/complytime-policies

concurrency:
  group: publish-policy-oci
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  assert-quay:
    name: Check Quay + image name
    runs-on: ubuntu-latest
    outputs:
      repo_lc: ${{ steps.image.outputs.repo_lc }}
    steps:
      - name: Require QUAY_ROBOT_* for promote
        env:
          QUAY_USER: ${{ secrets.QUAY_ROBOT_USERNAME }}
          QUAY_TOKEN: ${{ secrets.QUAY_ROBOT_TOKEN }}
        run: |
          if [ -z "${QUAY_USER}" ] || [ -z "${QUAY_TOKEN}" ]; then
            echo '::error::Missing QUAY_ROBOT_USERNAME or QUAY_ROBOT_TOKEN.'
            echo 'Add both: repo Settings, Secrets and variables, Actions.'
            echo 'Forks do not inherit secrets from the upstream repository.'
            exit 1
          fi
      - name: GHCR image name (lowercase)
        id: image
        run: |
          r='${{ github.repository }}'
          echo "repo_lc=${r,,}" >> "$GITHUB_OUTPUT"

  publish-ghcr:
    name: Staging to GHCR (Gemara)
    needs: assert-quay
    if: success()
    uses: >-
      complytime/org-infra/.github/workflows/reusable_publish_gemara_oci.yml@7eabc2b960778190d38c591b7b96b376489d0acb
    with:
      image_name: ${{ needs.assert-quay.outputs.repo_lc }}
      oci_tag: ${{ inputs.release_tag }}
      bundle_file: ${{ inputs.bundle_file }}
      allow_unprotected_ref: ${{ inputs.allow_unprotected_ref }}
    secrets: inherit

  sign-verify:
    name: Keyless sign + verify attestations
    needs: publish-ghcr
    if: success()
    uses: >-
      complytime/org-infra/.github/workflows/reusable_sign_and_verify.yml@7eabc2b960778190d38c591b7b96b376489d0acb
    # image + digest: workflow_call outputs of reusable_publish_gemara_oci (complytime/org-infra; job publish).
    # The Actions schema cannot resolve cross-repo reusable outputs; IDE may warn here — safe to ignore.
    with:
      image_name: ${{ needs.publish-ghcr.outputs.image }}
      digest: ${{ needs.publish-ghcr.outputs.digest }}
      allowed_identity_regex: ${{ format('https://github.com/{0}/.*', github.repository_owner) }}
      verify_vuln: false
      allow_unprotected_ref: ${{ inputs.allow_unprotected_ref }}
    secrets: inherit

  promote:
    name: Promote to Quay
    needs: [assert-quay, sign-verify]
    permissions:
      contents: read
      packages: read
    uses: >-
      complytime/org-infra/.github/workflows/resuable_publish_quay.yml@7eabc2b960778190d38c591b7b96b376489d0acb
    with:
      source_registry: ghcr.io
      source_image: ${{ needs.assert-quay.outputs.repo_lc }}
      source_tag: ${{ inputs.release_tag }}
      dest_registry: quay.io
      dest_image: ${{ inputs.dest_image }}
      dest_tag: ${{ inputs.release_tag }}
      verify_signature: true
      fail_if_dest_exists: true
      include_sha_tags: true
    secrets:
      source_token: ${{ secrets.GITHUB_TOKEN }}
      dest_username: ${{ secrets.QUAY_ROBOT_USERNAME }}
      dest_password: ${{ secrets.QUAY_ROBOT_TOKEN }}
