---
# Publish Gemara: GHCR (staging) → org-infra promote → Quay. See
# specs/001-policy-oci-publish/spec.md and README (publish matrix).

name: Publish policy OCI

"on":
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag for GHCR and Quay (e.g. v0.1.0, sha-abc123de)"
        required: true
        type: string

concurrency:
  group: publish-policy-oci
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Pack and push to GHCR
    runs-on: ubuntu-latest
    outputs:
      source_image: ${{ steps.ghcr_image.outputs.repo_lc }}
      source_tag: ${{ github.event.inputs.release_tag }}
    steps:
      - name: Checkout (default branch)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: GHCR image name (lowercase)
        id: ghcr_image
        run: |
          r='${{ github.repository }}'
          lc=$(echo "$r" | tr '[:upper:]' '[:lower:]')
          echo "repo_lc=$lc" >> "$GITHUB_OUTPUT"

      - name: Publish Gemara OCI bundle (staging)
        id: pack
        # Interim: pin; migrate to org action per FR-006. See README.
        uses: >-
          sonupreetam/gemara-publish-oci@7203d6158a16208a0338cc33ea001bb077f4705c
        with:
          registry: ghcr.io
          repository: ${{ steps.ghcr_image.outputs.repo_lc }}
          tag: ${{ github.event.inputs.release_tag }}
          file: bundles/cis-fedora-l1-workstation.yaml
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          validate: "true"
          working_directory: "."

  promote:
    name: Promote to Quay
    needs: publish
    if: success()
    permissions:
      contents: read
      packages: read
    # Pin SHA per FR-006. Update when resuable_publish_quay changes. See README.
    uses: >-
      complytime/org-infra/.github/workflows/resuable_publish_quay.yml@790e4080713fbd3d4359bcbd6b665699b27e7c30
    with:
      source_registry: ghcr.io
      source_image: ${{ needs.publish.outputs.source_image }}
      source_tag: ${{ needs.publish.outputs.source_tag }}
      dest_registry: quay.io
      dest_image: continuouscompliance/complytime-policies
      dest_tag: ${{ needs.publish.outputs.source_tag }}
      verify_signature: true
      fail_if_dest_exists: true
      include_sha_tags: true
    secrets:
      source_token: ${{ secrets.GITHUB_TOKEN }}
      dest_username: ${{ secrets.QUAY_ROBOT_USERNAME }}
      dest_password: ${{ secrets.QUAY_ROBOT_TOKEN }}
