---
# Publish Gemara: GHCR (staging) → org-infra promote → Quay. See
# specs/001-policy-oci-publish/spec.md and README (publish matrix).

name: Publish policy OCI

"on":
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag for GHCR and Quay (e.g. v0.1.0, sha-abc123de)"
        required: true
        type: string

concurrency:
  group: publish-policy-oci
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  # Required for keyless cosign sign on staging (promote runs cosign verify).
  id-token: write

jobs:
  assert-quay-secrets:
    name: Check Quay secrets (repository Actions)
    runs-on: ubuntu-latest
    steps:
      - name: Require QUAY_ROBOT_* for promote
        env:
          QUAY_USER: ${{ secrets.QUAY_ROBOT_USERNAME }}
          QUAY_TOKEN: ${{ secrets.QUAY_ROBOT_TOKEN }}
        run: |
          if [ -z "${QUAY_USER}" ] || [ -z "${QUAY_TOKEN}" ]; then
            echo '::error::Missing QUAY_ROBOT_USERNAME or QUAY_ROBOT_TOKEN.'
            echo 'Add both: repo Settings, Secrets and variables, Actions.'
            echo 'Forks do not inherit secrets from the upstream repository.'
            exit 1
          fi

  publish:
    name: Pack and push to GHCR
    needs: assert-quay-secrets
    runs-on: ubuntu-latest
    outputs:
      source_image: ${{ steps.ghcr_image.outputs.repo_lc }}
      source_tag: ${{ github.event.inputs.release_tag }}
    steps:
      - name: Checkout (default branch)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: GHCR image name (lowercase)
        id: ghcr_image
        run: |
          r='${{ github.repository }}'
          lc=$(echo "$r" | tr '[:upper:]' '[:lower:]')
          echo "repo_lc=$lc" >> "$GITHUB_OUTPUT"

      - name: Publish Gemara OCI bundle (staging)
        id: pack
        # Interim: pin; migrate to org action per FR-006. See README.
        uses: >-
          sonupreetam/gemara-publish-oci@7203d6158a16208a0338cc33ea001bb077f4705c
        with:
          registry: ghcr.io
          repository: ${{ steps.ghcr_image.outputs.repo_lc }}
          tag: ${{ github.event.inputs.release_tag }}
          file: bundles/cis-fedora-l1-workstation.yaml
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          validate: "true"
          working_directory: "."

      # org-infra promote uses cosign verify on the staging digest. The publish
      # action does not sign; keyless sign here so verify_signature: true works.
      - name: Set up cosign
        uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003

      - name: Log in to GHCR (cosign)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            cosign login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Keyless sign staging image
        run: |
          set -euo pipefail
          D="${{ steps.pack.outputs.digest }}"
          if [[ ! "$D" == sha256:* ]]; then
            D="sha256:$D"
          fi
          REF="ghcr.io/${{ steps.ghcr_image.outputs.repo_lc }}@$D"
          cosign sign --yes "$REF"

  promote:
    name: Promote to Quay
    needs: publish
    if: success()
    permissions:
      contents: read
      packages: read
    # Pin SHA per FR-006. Update when resuable_publish_quay changes. See README.
    uses: >-
      complytime/org-infra/.github/workflows/resuable_publish_quay.yml@790e4080713fbd3d4359bcbd6b665699b27e7c30
    with:
      source_registry: ghcr.io
      source_image: ${{ needs.publish.outputs.source_image }}
      source_tag: ${{ needs.publish.outputs.source_tag }}
      dest_registry: quay.io
      dest_image: test_complytime/complytime-policies
      dest_tag: ${{ needs.publish.outputs.source_tag }}
      verify_signature: true
      fail_if_dest_exists: true
      include_sha_tags: true
    secrets:
      source_token: ${{ secrets.GITHUB_TOKEN }}
      dest_username: ${{ secrets.QUAY_ROBOT_USERNAME }}
      dest_password: ${{ secrets.QUAY_ROBOT_TOKEN }}
