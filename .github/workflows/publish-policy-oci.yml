# SPDX-License-Identifier: Apache-2.0
---
# Gemara policy OCI: GHCR staging (pack + attest) → org-infra sign/verify → Quay promote
# (spec: specs/001-policy-oci-publish/…)
#
# The Gemara pack + SLSA/SBOM attestation run inline here. GitHub can only `workflow_call`
# reusable workflows that exist on the target ref; `reusable_publish_gemara_oci` is not yet
# on public complytime/org-infra, so the same steps are kept in-repo until that lands
# (then switch publish-ghcr back to `uses:` the reusable).
# Interim composite: sonupreetam/gemara-publish-oci@… | Quay default: test_complytime/…
#
# Pin: complytime/org-infra (sign + promote only; bump in README per FR-006)

name: Publish policy OCI

"on":
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag for GHCR and Quay (e.g. v0.1.0, sha-abc123de)"
        required: true
        type: string
      allow_unprotected_ref:
        description: >-
          Set true if the default branch is not protected (e.g. fork) so
          staging, sign, and attestation jobs run.
        required: false
        type: boolean
        default: false
      bundle_file:
        description: "Root Gemara bundle YAML (relative to repo root)"
        required: false
        type: string
        default: bundles/cis-fedora-l1-workstation.yaml
      dest_image:
        description: >-
          Quay path (namespace/repository) without registry. Default is a POC namespace;
          set continuouscompliance/complytime-policies for org production.
        required: false
        type: string
        default: test_complytime/complytime-policies

concurrency:
  group: publish-policy-oci
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  assert-quay:
    name: Check Quay + image name
    runs-on: ubuntu-latest
    outputs:
      repo_lc: ${{ steps.image.outputs.repo_lc }}
    steps:
      - name: Require QUAY_ROBOT_* for promote
        env:
          QUAY_USER: ${{ secrets.QUAY_ROBOT_USERNAME }}
          QUAY_TOKEN: ${{ secrets.QUAY_ROBOT_TOKEN }}
        run: |
          if [ -z "${QUAY_USER}" ] || [ -z "${QUAY_TOKEN}" ]; then
            echo '::error::Missing QUAY_ROBOT_USERNAME or QUAY_ROBOT_TOKEN.'
            echo 'Add both: repo Settings, Secrets and variables, Actions.'
            echo 'Forks do not inherit secrets from the upstream repository.'
            exit 1
          fi
      - name: GHCR image name (lowercase)
        id: image
        run: |
          r='${{ github.repository }}'
          echo "repo_lc=${r,,}" >> "$GITHUB_OUTPUT"

  publish-ghcr:
    name: Staging to GHCR (Gemara)
    needs: assert-quay
    if: success() && (github.ref_protected || inputs.allow_unprotected_ref)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      digest: ${{ steps.norm_digest.outputs.digest }}
      image: ${{ steps.image_out.outputs.image }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image ref (no registry in image_name)
        id: image_out
        run: |
          echo "image=ghcr.io/${{ needs.assert-quay.outputs.repo_lc }}" >> "$GITHUB_OUTPUT"

      - name: Pack and push Gemara bundle
        id: gemara
        uses: sonupreetam/gemara-publish-oci@7203d6158a16208a0338cc33ea001bb077f4705c
        with:
          registry: ghcr.io
          repository: ${{ needs.assert-quay.outputs.repo_lc }}
          tag: ${{ inputs.release_tag }}
          file: ${{ inputs.bundle_file }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          validate: "true"
          working_directory: "."

      - name: Normalize digest for attestation
        id: norm_digest
        env:
          RAW: ${{ steps.gemara.outputs.digest }}
        run: |
          D="${RAW}"
          if [[ ! "$D" == sha256:* ]]; then
            D="sha256:$D"
          fi
          echo "digest=$D" >> "$GITHUB_OUTPUT"

      - name: Attest SLSA provenance
        if: ${{ github.ref_protected || inputs.allow_unprotected_ref }}
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-name: ${{ steps.image_out.outputs.image }}
          subject-digest: ${{ steps.norm_digest.outputs.digest }}
          push-to-registry: true

      - name: Generate SBOM
        if: ${{ github.ref_protected || inputs.allow_unprotected_ref }}
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: "."
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Attest SBOM
        if: ${{ github.ref_protected || inputs.allow_unprotected_ref }}
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-name: ${{ steps.image_out.outputs.image }}
          subject-digest: ${{ steps.norm_digest.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

  sign-verify:
    name: Keyless sign + verify attestations
    needs: publish-ghcr
    uses: complytime/org-infra/.github/workflows/reusable_sign_and_verify.yml@9205a3ac6b76b75dbe6e22b2f0f330bc8edbeb38
    with:
      image_name: ${{ needs.publish-ghcr.outputs.image }}
      digest: ${{ needs.publish-ghcr.outputs.digest }}
      allowed_identity_regex: ${{ format('https://github.com/{0}/.*', github.repository_owner) }}
      verify_vuln: false
      allow_unprotected_ref: ${{ inputs.allow_unprotected_ref }}
    secrets: inherit

  promote:
    name: Promote to Quay
    needs: [assert-quay, sign-verify]
    permissions:
      contents: read
      packages: read
    uses: complytime/org-infra/.github/workflows/resuable_publish_quay.yml@9205a3ac6b76b75dbe6e22b2f0f330bc8edbeb38
    with:
      source_registry: ghcr.io
      source_image: ${{ needs.assert-quay.outputs.repo_lc }}
      source_tag: ${{ inputs.release_tag }}
      dest_registry: quay.io
      dest_image: ${{ inputs.dest_image }}
      dest_tag: ${{ inputs.release_tag }}
      verify_signature: true
      fail_if_dest_exists: true
      include_sha_tags: true
    secrets:
      source_token: ${{ secrets.GITHUB_TOKEN }}
      dest_username: ${{ secrets.QUAY_ROBOT_USERNAME }}
      dest_password: ${{ secrets.QUAY_ROBOT_TOKEN }}
